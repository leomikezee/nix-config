position = "Bottom"
region = "en-GB"

[modules]
left = [ "Workspaces" ]
center = [ "MediaPlayer", "Tempo" ]
right = [ "Tray", "Notifications", "SystemInfo", "Privacy", "Settings" ]

[workspaces]
indicator_format = "NameAndIcons"

[media_player]
indicator_format = "Icon"
indicator_visualizer = "Background"
menu_visualizer = true
visualizer_framerate = 30

[tempo]
clock_format = "%H:%M %a %d"
weather_location = { City = "Nansha, China" }
weather_indicator = "IconAndTemperature"

[settings]
shutdown_cmd = "hyprshutdown -t 'Shutting down...' --post-cmd 'shutdown -P 0'"
reboot_cmd = "hyprshutdown -t 'Restarting...' --post-cmd 'reboot'"
logout_cmd = "hyprshutdown"

[appearance]
success_color = "#a6e3a1"
warning_color = "#f9e2af"
danger_color = "#f38ba8"
text_color = "#cdd6f4"
workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]
scale_factor = 1.25

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"

[appearance.bar]
surface = "solid"
radius = "md"
