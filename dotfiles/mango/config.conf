tag_gather=1
tag_animation_direction=0
tag_rule=id:*,layout_name:scroller,scroller_default_proportion:0.5,scroller_default_proportion_single:0.5,scroller_ignore_proportion_single:0
scroller_structs=0
edge_scroller_pointer_focus=0

# Dimensions
border_px=2
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=4
gap_outer_vertical=4

# Startup
exec_once=fcitx5
exec_once=kdeconnect-indicator
exec_once=mako
exec_once=nm-applet
exec_once=sunsetr
exec_once=swaybg -i ~/Pictures/wallpaper.svg
exec_once=tailscale systray

# Session
bind=SUPER+SHIFT,R,reload_config
bind=SUPER,D,spawn,fuzzel
bind=SUPER,T,spawn,kitty
bind=SUPER,slash,spawn,kitten quick-access-terminal
bind=SUPER+ALT,L,spawn,swaylock
bind=SUPER,Q,killclient
bind=SUPER+SHIFT,E,quit
bind=CTRL+ALT,Delete,quit
bind=SUPER,O,toggleoverview

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
bind=SUPER,Tab,focusdir,right
bind=SUPER+SHIFT,Tab,focusdir,left

# Window movement
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,H,move_client,left
bind=SUPER+CTRL,J,move_client,down
bind=SUPER+CTRL,K,move_client,up
bind=SUPER+CTRL,L,move_client,right
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,H,focusmon,left
bind=SUPER+SHIFT,J,focusmon,down
bind=SUPER+SHIFT,K,focusmon,up
bind=SUPER+SHIFT,L,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Down,tagmon,down
bind=SUPER+CTRL+SHIFT,Up,tagmon,up
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,H,tagmon,left
bind=SUPER+CTRL+SHIFT,J,tagmon,down
bind=SUPER+CTRL+SHIFT,K,tagmon,up
bind=SUPER+CTRL+SHIFT,L,tagmon,right

# Tags
bind=SUPER,U,viewtoright,0
bind=SUPER,I,viewtoleft,0
bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER+CTRL,U,tagtoright,0
bind=SUPER+CTRL,I,tagtoleft,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
axisbind=SUPER,DOWN,viewtoright,0
axisbind=SUPER,UP,viewtoleft,0
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+CTRL,DOWN,move_client,right
axisbind=SUPER+CTRL,UP,move_client,left
axisbind=SUPER+CTRL+SHIFT,UP,tagtoleft,0
axisbind=SUPER+CTRL+SHIFT,DOWN,tagtoright,0

# Layout
bind=SUPER,space,toggle_scratchpad
bind=SUPER+SHIFT,space,minimized
bind=SUPER+CTRL,space,restore_minimized
bind=SUPER,bracketleft,exchange_client,left
bind=SUPER,bracketright,exchange_client,right
bind=SUPER,comma,exchange_client,left
bind=SUPER,period,exchange_client,right
bind=SUPER,R,switch_proportion_preset
bind=SUPER,Minus,setmfact,-0.05
bind=SUPER,Equal,setmfact,+0.05
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,M,togglemaximizescreen
bind=SUPER,C,centerwin
bind=SUPER+SHIFT,Minus,incgaps,-1
bind=SUPER+SHIFT,Equal,incgaps,1
bind=SUPER,V,togglefloating

# Media
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-

# Screenshots
bind=NONE,Print,spawn_shell,grim - | wl-copy
bind=CTRL,Print,spawn_shell,mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png"
bind=ALT,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
